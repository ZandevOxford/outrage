[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rage"
version = "0.1.0"
description = "A key-addressed retrieval system for coding agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
# Optional on purpose: the parquet backend is for the reference-base case, and
# a base install that only ever holds session context should not pay 36 MB of
# wheel for it. `rage.store_parquet` imports pyarrow inside the module, and
# `rage.store._backend_for` imports that module only when a `.parquet` file is
# named, so nothing here is touched until something asks for one.
parquet = ["pyarrow>=18"]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["sphinx>=8", "furo"]

[project.scripts]
rage = "rage.cli:main"
rage-server = "rage.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
