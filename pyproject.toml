[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outrage"
# One source for the version: `src/outrage/__init__.py`, which is what the
# server, the CLI and the docs already read. Carrying it here as well gave two
# strings that nothing checked against each other.
dynamic = ["version"]
authors = [
    { name="John M Reynolds", email="zandev@gmail.com" },
]
description = "A key-addressed retrieval system for coding agents"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# PEP 639: an SPDX expression rather than a classifier, and the file named so
# that it is carried in the wheel and the sdist rather than only in the repo.
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.2"]

[project.urls]
# Homepage and Issues are the same repository; both are named because they are
# separate rows in a package index's sidebar, and "where do I report this" is
# not a question a reader should have to answer by editing a URL.
Homepage = "https://github.com/ZandevOxford/outrage"
Issues = "https://github.com/ZandevOxford/outrage/issues"

[project.optional-dependencies]
# Optional on purpose: the parquet backend is for the reference-base case, and
# a base install that only ever holds session context should not pay 36 MB of
# wheel for it. `outrage.store_parquet` imports pyarrow inside the module, and
# `outrage.store._backend_for` imports that module only when a `.parquet` file is
# named, so nothing here is touched until something asks for one.
parquet = ["pyarrow>=18"]
# hatchling and build are here because the suite builds the sdist and the wheel
# and asserts what is in them - tests/test_packaging.py. Without them that
# check skips, and a release can drop a file the way 0.1.0 did.
# `twine` is here for the release process rather than the suite:
# `reference/distribution` in the store has `twine check` as a step before
# every upload, and nothing declared it, so preparing a release meant finding
# an environment that happened to have it.
dev = ["pytest>=8", "ruff>=0.6", "hatchling", "build>=1", "PyYAML>=6", "twine>=5"]
# `sphinx-markdown-builder` is not optional within this extra even though only
# `make markdown` uses it: `docs/conf.py` names it in `extensions`, so an
# install without it cannot build the HTML either.
docs = ["sphinx>=8", "furo", "sphinx-markdown-builder>=0.6.11"]

[project.scripts]
outrage = "outrage.cli:main"
outrage-server = "outrage.server:main"

[tool.hatch.version]
path = "src/outrage/__init__.py"

[tool.hatch.build.targets.sdist]
# PyPI rejected the 0.3.0 candidate when Hatchling's moving default emitted
# Core Metadata 2.5. Pin the newest version needed here: 2.4 carries the PEP
# 639 licence fields above and is accepted by the publication endpoint.
core-metadata-version = "2.4"
# Both lines exist for one bug, which shipped as 0.1.0: the sdist, and so the
# wheel built from it, silently lost `src/outrage/skills/`.
#
# hatchling walks the project with `safe_walk`, which follows symlinks and
# refuses to visit the same (st_dev, st_ino) twice. `.claude/skills/outrage` is a
# symlink to a directory inside `src/`, for dogfooding, and `.claude` sorts
# before `src` - so the walk claimed that inode under `.claude` and then
# skipped the real directory as already seen. `exclude` alone does not help:
# hatchling only prunes a directory from the walk when `skip-excluded-dirs` is
# set, so without it the walk still descends and still claims the inode.
#
# The wheel target never hit this because `packages` roots its walk at
# `src/outrage`, which is why `pip wheel` produced a correct wheel from the
# same commit that `python -m build` did not.
#
# Excluding the dogfooding config is right anyway: nothing installing outrage
# wants this project's own `.claude`.
exclude = [".claude"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/outrage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
