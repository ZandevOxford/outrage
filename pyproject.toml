[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outrage"
# One source for the version: `src/outrage/__init__.py`, which the server, the
# CLI and the docs read. A second copy here would be a string nothing checks.
dynamic = ["version"]
authors = [
    { name="John M Reynolds", email="zandev@gmail.com" },
]
description = "A key-addressed retrieval system for coding agents"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# PEP 639: an SPDX expression rather than a classifier, and the licence file
# named so that the wheel and the sdist carry it.
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["filelock>=3.12", "mcp>=1.2", "pydantic>=2", "tomlkit>=0.13"]

[project.urls]
# The same repository twice, because a package index shows them as separate
# links and somebody looking for where to report a problem should find one.
Homepage = "https://github.com/ZandevOxford/outrage"
Issues = "https://github.com/ZandevOxford/outrage/issues"

[project.optional-dependencies]
# Every extra is optional because a store that only holds session context needs
# none of them. Each library is imported inside the module that uses it, so an
# install without one is untouched until something asks for it.
#
# Parquet stores, both halves: duckdb reads them, and pyarrow writes them for
# `outrage pack` and reads one for a mount that says `type=pyarrow`. Together
# they are well over 100 MB installed. duckdb's floor is the version its backend
# was measured and built against.
parquet = ["pyarrow>=18", "duckdb>=1.5"]
# Converting other document formats for `outrage ingest`.
documents = ["markitdown[docx,pdf,pptx,xlsx]>=0.1.7,<0.2"]
# A store kept in PostgreSQL, so that one store can be shared across devices.
# `psycopg[binary]` rather than `psycopg`, which is pure Python and finds libpq
# at runtime: an install that has to locate a system libpq is the one thing a
# user installing an extra cannot be asked to debug, and the binary wheel
# carries its own. Somebody who would rather link against their own libpq
# installs `psycopg` and gets the same module.
postgres = ["psycopg[binary]>=3.2"]
# What the README recommends: every extra a user might want, named rather than
# repeated so each requirement is written once. Not `dev` or `docs`, which are
# for working on outrage itself; tests/test_packaging.py fails if one is missing.
all = ["outrage[documents,parquet,postgres]"]
# build and hatchling let the suite build the sdist and the wheel and check what
# they contain, which it otherwise skips: a build can drop a file silently, as
# 0.1.0 did. twine is for releases, which run `twine check` before uploading.
dev = [
    "build>=1",
    "hatchling",
    "omnidep>=0.4",
    "pytest>=8",
    # A temporary PostgreSQL cluster for the Postgres tests, on a machine that
    # has the server binaries but no server set up. It is not how the tests
    # find a server when one is already running: that is a DSN in
    # OUTRAGE_TEST_POSTGRES, which is also the only way to reach a *remote*
    # one, and localhost hides both round-trip cost and certificate checking.
    "pytest-postgresql>=6",
    "PyYAML>=6",
    "ruff>=0.6",
    "twine>=5",
]
# `sphinx-markdown-builder` is needed even for the HTML build, because
# `docs/conf.py` names it in `extensions`.
docs = ["sphinx>=8", "furo", "sphinx-markdown-builder>=0.6.11"]

[project.scripts]
outrage = "outrage.cli:main"
outrage-server = "outrage.server:main"

[tool.hatch.version]
path = "src/outrage/__init__.py"

[tool.hatch.build.targets.sdist]
# Hatchling's default metadata version moves, and PyPI rejected 2.5. 2.4 carries
# the PEP 639 licence fields above and is accepted.
core-metadata-version = "2.4"
# `.claude/skills/outrage` is a symlink into `src/outrage/skills/`, and hatchling's
# walk visits each inode once. `.claude` sorts first, so without these two lines
# the sdist - and the wheel built from it - loses the real directory, which is
# how 0.1.0 shipped. `exclude` alone does not stop the walk descending;
# `skip-excluded-dirs` does. The wheel target is unaffected because `packages`
# starts its walk at `src/outrage`.
#
# The excluded paths are also of no use to anybody installing outrage:
# `.claude` is this repository's own harness configuration, `.mcp.json` names
# a server command on one machine, and `import` holds separate distributions.
exclude = [".claude", ".mcp.json", "import"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/outrage"]

[tool.omnidep]
# omnidep 0.4 does not read PEP 621 optional dependencies, so it would report
# the optional imports despite the extras above. One entry per optional import,
# so adding one without listing it here fails the check.
ignore-imports = ["pyarrow", "duckdb", "markitdown", "psycopg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test needing a PostgreSQL server carries this, so that `-m "not
# postgres"` is a whole suite run on a machine without one. Registered here
# rather than left to a warning, because a marker nobody declared is a marker
# a typo silently turns into no marker at all.
markers = ["postgres: needs a PostgreSQL server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
